<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>白屏检测管理面板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>白屏检测控制台</h1>
      <div class="actions">
        <label class="concurrency-label">
          并发数
          <select id="concurrencySelect">
            <option value="1">1</option>
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="8">8</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="50">50</option>
          </select>
        </label>
        <button id="startBtn" class="btn btn-primary">开始检测</button>
        <button id="stopBtn" class="btn btn-warning" style="display:none;">停止检测</button>
        <button id="clearBtn" class="btn btn-danger">清除历史</button>
      </div>
    </header>

    <!-- 定时任务控制 -->
    <div class="cron-panel">
      <div class="cron-header">
        <span class="cron-title">⏰ 定时检测</span>
        <span id="cronStatus" class="cron-status">未启用</span>
      </div>
      <div class="cron-controls">
        <label class="interval-label">
          间隔
          <select id="cronInterval">
            <option value="1">1 分钟</option>
            <option value="5">5 分钟</option>
            <option value="10">10 分钟</option>
            <option value="30">30 分钟</option>
            <option value="60" selected>1 小时</option>
            <option value="120">2 小时</option>
            <option value="360">6 小时</option>
            <option value="720">12 小时</option>
            <option value="1440">24 小时</option>
          </select>
        </label>
        <button id="cronStartBtn" class="btn btn-success">启动定时</button>
        <button id="cronStopBtn" class="btn btn-secondary" style="display:none;">停止定时</button>
      </div>
      <div id="cronInfo" class="cron-info"></div>
    </div>

    <!-- 手动URL测试 -->
    <div class="manual-test-panel">
      <div class="manual-test-header">
        <span class="manual-test-title">🔗 手动测试</span>
        <span class="manual-test-hint">每行输入一个URL</span>
      </div>
      <textarea id="manualUrls" class="manual-urls-input" placeholder="https://example.com/page1
https://example.com/page2
..."></textarea>
      <div class="manual-test-actions">
        <button id="manualTestBtn" class="btn btn-primary">开始测试</button>
        <button id="manualStopBtn" class="btn btn-warning" style="display:none;">停止测试</button>
        <span id="manualUrlCount" class="url-count">0 个URL</span>
      </div>
    </div>

    <!-- 状态区域 -->
    <div id="statusBox" class="status-box hidden">
      <div class="status-header">
        <span id="statusText">准备中...</span>
        <span id="progressText" class="progress-text">0 / 0</span>
      </div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <!-- 结果列表 -->
    <div class="results-section">
      <h2>检测历史</h2>
      <div id="resultsList" class="results-list">
        <p class="empty-text">暂无检测记录</p>
      </div>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const resultsList = document.getElementById('resultsList');

    let pollInterval = null;

    // 加载结果
    async function loadResults() {
      const res = await fetch('/api/results');
      const results = await res.json();
      renderResults(results);
    }

    // 渲染结果
    function renderResults(results) {
      if (results.length === 0) {
        resultsList.innerHTML = '<p class="empty-text">暂无检测记录</p>';
        return;
      }

      resultsList.innerHTML = results.map(r => `
        <div class="result-card">
          <div class="result-header">
            <span class="result-time">${new Date(r.timestamp).toLocaleString(undefined, {
              year: 'numeric', month: '2-digit', day: '2-digit', 
              hour: '2-digit', minute: '2-digit'
            })}</span>
            <div class="result-stats">
              <span class="stat-item">总计 <span class="stat-value">${r.total}</span></span>
              <span class="stat-item">白屏 <span class="stat-value ${r.whiteScreenCount > 0 ? 'danger' : ''}">${r.whiteScreenCount}</span></span>
            </div>
          </div>
          <div class="result-urls">
            ${r.results.filter(u => u.isWhiteScreen).map(u => `
              <div class="url-item">
                <span class="url-label white">白屏</span>
                <div>
                  <a href="${u.url}" target="_blank">${u.url}</a>
                  ${u.error ? `<div class="error-msg">${u.error}</div>` : ''}
                </div>
              </div>
            `).join('') || '<div class="no-white"><svg style="width:16px;height:16px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 检测通过，无白屏页面</div>'}
          </div>
        </div>
      `).join('');
    }

    // 开始检测
    async function startCheck() {
      const concurrency = parseInt(document.getElementById('concurrencySelect').value);
      startBtn.disabled = true;
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      startBtn.textContent = '检测中...';
      statusBox.classList.remove('hidden');
      
      await fetch('/api/check', { 
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ concurrency })
      });
      pollStatus();
    }

    // 停止检测
    async function stopCheck() {
      stopBtn.disabled = true;
      const res = await fetch('/api/stop', { method: 'POST' });
      if (res.ok) {
        statusText.textContent = '正在停止...';
      }
    }

    // 轮询状态
    function pollStatus() {
      if (pollInterval) clearInterval(pollInterval);
      
      pollInterval = setInterval(async () => {
        const res = await fetch('/api/status');
        const status = await res.json();
        
        statusText.textContent = status.current || '准备中...';
        
        if (status.total > 0) {
          const percent = (status.progress / status.total * 100).toFixed(0);
          progressFill.style.width = `${percent}%`;
          progressText.textContent = `${status.progress} / ${status.total}`;
        }
        
        if (!status.isRunning) {
          clearInterval(pollInterval);
          // 恢复开始检测按钮
          startBtn.disabled = false;
          startBtn.style.display = 'inline-block';
          stopBtn.style.display = 'none';
          stopBtn.disabled = false;
          startBtn.textContent = '开始检测';
          // 恢复手动测试按钮（如果已初始化）
          if (typeof manualTestBtn !== 'undefined') {
            manualTestBtn.disabled = false;
            manualTestBtn.style.display = 'inline-block';
            manualStopBtn.style.display = 'none';
            manualStopBtn.disabled = false;
            manualUrls.disabled = false;
          }
          statusBox.classList.add('hidden');
          loadResults();
        }
      }, 1000);
    }

    // 清除历史
    async function clearHistory() {
      if (!confirm('确定要清除所有检测历史吗？此操作不可恢复。')) {
        return;
      }
      
      try {
        const res = await fetch('/api/results', { method: 'DELETE' });
        if (res.ok) {
          loadResults();
          alert('历史记录已清除');
        } else {
          alert('清除失败');
        }
      } catch (e) {
        alert('清除失败: ' + e.message);
      }
    }

    // 初始化
    startBtn.addEventListener('click', startCheck);
    stopBtn.addEventListener('click', stopCheck);
    clearBtn.addEventListener('click', clearHistory);
    loadResults();

    // 定时任务控制
    const cronStartBtn = document.getElementById('cronStartBtn');
    const cronStopBtn = document.getElementById('cronStopBtn');
    const cronInterval = document.getElementById('cronInterval');
    const cronStatus = document.getElementById('cronStatus');
    const cronInfo = document.getElementById('cronInfo');

    // 加载定时任务状态
    async function loadCronStatus() {
      const res = await fetch('/api/cron');
      const status = await res.json();
      updateCronUI(status);
    }

    // 更新定时任务 UI
    function updateCronUI(status) {
      if (status.enabled) {
        cronStatus.textContent = '运行中';
        cronStatus.className = 'cron-status enabled';
        cronStartBtn.style.display = 'none';
        cronStopBtn.style.display = 'inline-block';
        cronInterval.disabled = true;
        cronInterval.value = status.interval;
        cronInfo.innerHTML = `
          <span>每 ${status.interval} 分钟检测一次</span>
          ${status.lastRun ? `<span>上次: ${new Date(status.lastRun).toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</span>` : ''}
        `;
      } else {
        cronStatus.textContent = '未启用';
        cronStatus.className = 'cron-status';
        cronStartBtn.style.display = 'inline-block';
        cronStopBtn.style.display = 'none';
        cronInterval.disabled = false;
        cronInfo.innerHTML = '';
      }
    }

    // 启动定时任务
    cronStartBtn.addEventListener('click', async () => {
      const interval = parseInt(cronInterval.value);
      const res = await fetch('/api/cron/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ interval })
      });
      const data = await res.json();
      updateCronUI(data);
    });

    // 停止定时任务
    cronStopBtn.addEventListener('click', async () => {
      const res = await fetch('/api/cron/stop', { method: 'POST' });
      const data = await res.json();
      updateCronUI(data);
    });

    loadCronStatus();

    // 手动URL测试
    const manualUrls = document.getElementById('manualUrls');
    const manualTestBtn = document.getElementById('manualTestBtn');
    const manualStopBtn = document.getElementById('manualStopBtn');
    const manualUrlCount = document.getElementById('manualUrlCount');

    // 解析URL列表
    function parseUrls(text) {
      return text.split('\n')
        .map(line => line.trim())
        .filter(line => line && !line.startsWith('#') && line.startsWith('http'));
    }

    // 更新URL计数
    manualUrls.addEventListener('input', () => {
      const urls = parseUrls(manualUrls.value);
      manualUrlCount.textContent = `${urls.length} 个URL`;
    });

    // 开始手动测试
    async function startManualTest() {
      const urls = parseUrls(manualUrls.value);
      if (urls.length === 0) {
        alert('请输入至少一个有效的URL');
        return;
      }

      const concurrency = parseInt(document.getElementById('concurrencySelect').value);
      manualTestBtn.disabled = true;
      manualTestBtn.style.display = 'none';
      manualStopBtn.style.display = 'inline-block';
      manualUrls.disabled = true;
      statusBox.classList.remove('hidden');

      await fetch('/api/check/manual', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ urls, concurrency })
      });
      pollStatus();
    }

    // 停止手动测试
    async function stopManualTest() {
      manualStopBtn.disabled = true;
      const res = await fetch('/api/stop', { method: 'POST' });
      if (res.ok) {
        statusText.textContent = '正在停止...';
      }
    }

    manualTestBtn.addEventListener('click', startManualTest);
    manualStopBtn.addEventListener('click', stopManualTest);

    // 检查是否有正在进行的检测
    fetch('/api/status').then(r => r.json()).then(status => {
      if (status.isRunning) {
        startBtn.disabled = true;
        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        startBtn.textContent = '检测中...';
        statusBox.classList.remove('hidden');
        pollStatus();
      }
    });
  </script>
</body>
</html>
